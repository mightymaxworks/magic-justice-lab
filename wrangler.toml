name = "magic-justice-lab"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
[env.staging]
name = "magic-justice-lab"
[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
[env.production]
name = "magic-justice-lab-production"
[env.production.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Publicly approved image delivery; uploads are not exposed by this Worker.
[[env.staging.r2_buckets]]
binding = "LAB_ASSETS"
bucket_name = "magic-lab-assets"

[[env.production.r2_buckets]]
binding = "LAB_ASSETS"
bucket_name = "magic-lab-assets"
